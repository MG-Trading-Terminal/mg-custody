version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: custody
      POSTGRES_PASSWORD: custody_dev_password
      POSTGRES_DB: custody
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./crates/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custody"]
      interval: 5s
      timeout: 5s
      retries: 5

  custody:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CUSTODY_DATABASE__URL: postgres://custody:custody_dev_password@postgres:5432/custody
      CUSTODY_API__BIND: "0.0.0.0:8443"
      CUSTODY_CHAINS__ETHEREUM__RPC_URL: ${ETH_RPC_URL:-https://rpc.sepolia.org}
      RUST_LOG: info,custody=debug
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
