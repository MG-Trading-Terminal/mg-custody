[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/db",
    "crates/gateway",
    "crates/scanner",
    "crates/confirmations",
    "crates/address-factory",
    "crates/signing",
    "crates/mpc",
    "crates/policy",
    "crates/compliance",
    "crates/broadcaster",
    "crates/withdrawal-pipeline",
    "crates/wallet-manager",
    "crates/utxo",
    "crates/fee-estimator",
    "crates/reconciliation",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal", "migrate"] }

# Money — NEVER use f64
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# Crypto primitives
k256 = { version = "0.13", features = ["ecdsa-core", "sha256"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
bech32 = "0.11"
bs58 = { version = "0.5", features = ["check"] }
bip32 = { version = "0.5", features = ["secp256k1"] }
hex = "0.4"
hmac = "0.12"
rand = "0.8"

# Threshold MPC
cggmp21 = { version = "0.6", features = ["hd-wallet", "spof", "curve-secp256k1"] }
generic-ec = { version = "0.4", features = ["serde"] }
frost-ed25519 = "2.2"
frost-core = "2.2"

# Encryption
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }

# Key safety
zeroize = { version = "1", features = ["derive"] }

# Ethereum
alloy = { version = "1", features = ["full"] }

# Bitcoin
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }
bitcoincore-rpc = "0.19"

# Solana
solana-client = "2"
solana-sdk = "2"
spl-token = "7"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# Error handling
anyhow = "1"
thiserror = "2"

# HTTP client (for webhooks)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Concurrent collections
dashmap = "6"

# Testing
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
