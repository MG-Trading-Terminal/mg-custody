name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude custody-server

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: custody
          POSTGRES_PASSWORD: custody_dev_password
          POSTGRES_DB: custody
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Run all migrations
        run: for f in crates/db/migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done
        env:
          DATABASE_URL: postgres://custody:custody_dev_password@localhost:5432/custody
      - name: Run DB + E2E tests
        run: cargo test -p custody-db --test integration && cargo test -p custody-server --test e2e --test full_stack --test withdrawal_flow --test deposit_flow --test approval_flow --test broadcast_flow --test multichain_withdrawal --test retry_and_concurrency -- --test-threads=1
        env:
          DATABASE_URL: postgres://custody:custody_dev_password@localhost:5432/custody

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [check, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin custody --bin custody-admin --bin custody-seed --bin custody-signer

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mg-custody:test .

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Security tests
        run: cargo test -p custody-common security_tests
      - name: Cargo deny (licenses + advisories)
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check advisories bans licenses sources
      - name: Cargo audit (RUSTSEC)
        run: |
          cargo install cargo-audit --quiet || true
          cargo audit

  build-signer:
    name: Build Signer Binary
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin custody-signer
      - name: Verify signer binary exists
        run: test -f target/release/custody-signer
