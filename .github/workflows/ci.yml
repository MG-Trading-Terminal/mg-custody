name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude custody-server

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: custody
          POSTGRES_PASSWORD: custody_dev_password
          POSTGRES_DB: custody
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run migrations
        run: psql $DATABASE_URL -f crates/db/migrations/001_initial_schema.sql
        env:
          DATABASE_URL: postgres://custody:custody_dev_password@localhost:5432/custody
      - name: Run DB + E2E tests
        run: cargo test -p custody-db --test integration && cargo test -p custody-server --test e2e --test full_stack --test withdrawal_flow --test deposit_flow --test approval_flow --test broadcast_flow --test multichain_withdrawal --test retry_and_concurrency -- --test-threads=1
        env:
          DATABASE_URL: postgres://custody:custody_dev_password@localhost:5432/custody

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [check, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin custody --bin custody-admin --bin custody-seed

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mg-custody:test .
