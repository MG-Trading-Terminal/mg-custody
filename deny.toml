# cargo-deny configuration
# Run: cargo deny check
# CI: cargo deny check advisories bans licenses sources

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
# Acknowledged advisories — documented justification for each:
ignore = [
    # cggmp21 presignature security issue. No fix available upstream.
    # Our MPC uses simulated rounds, not production presigning cache.
    "RUSTSEC-2025-0127",
    # rsa Marvin Attack timing sidechannel. No fix available.
    # We don't use RSA for signing — only Ed25519/secp256k1.
    # rsa is a transitive dep from webpki/rustls.
    "RUSTSEC-2023-0071",
    # rand unsound with custom logger — we don't use custom loggers.
    "RUSTSEC-2026-0097",
]

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
copyleft = "deny"
default = "deny"
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
